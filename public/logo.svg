<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Top Face -->
  <polygon points="50,10 90,32 50,54 10,32" fill="#ffffff" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="50,54 90,32 90,75 50,95" fill="#ff90e8" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="10,32 50,54 50,95 10,75" fill="#ffc900" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Layer Line representing 3D printing layers -->
  <polyline points="10,54 50,76 90,54" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
